<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện Mini - Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="demo_dndk.css">
</head>
<body>
    <main class="page">
        <section class="auth-card" aria-label="Đăng nhập và đăng ký tài khoản">
            <div class="logo"><i class="fa-solid fa-book-open"></i></div>
            <h1>THƯ VIỆN MINI</h1>
            <p class="subtitle">Hệ thống quản lý thư viện</p>

            <section id="loginPanel">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="username">Tên đăng nhập</label>
                        <div class="input-wrap"><i class="fa-solid fa-user"></i><input id="username" name="username" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username" required></div>
                    </div>
                    <div class="input-group">
                        <label for="password">Mật khẩu</label>
                        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required><button class="toggle-password" type="button" data-target="password" aria-label="Hiện hoặc ẩn mật khẩu"><i class="fa-regular fa-eye"></i></button></div>
                    </div>
                    <div class="options">
                        <label class="remember"><input type="checkbox" id="remember"> Ghi nhớ đăng nhập</label>
                        <a class="text-link" href="#" id="forgotPassword">Quên mật khẩu?</a>
                    </div>
                    <button class="primary-btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP</button>
                </form>
                <p class="switch-text">Chưa có tài khoản? <button type="button" class="switch-btn" id="showRegister">Đăng ký ngay</button></p>
            </section>

            <section id="registerPanel" class="hidden">
                <form id="registerForm">
                    <div class="input-group">
                        <label for="fullName">Họ và tên</label>
                        <div class="input-wrap"><i class="fa-solid fa-id-card"></i><input id="fullName" name="fullName" type="text" placeholder="Nhập họ và tên" autocomplete="name" maxlength="100" required></div>
                    </div>
                    <div class="input-group">
                        <label for="regUsername">Tên đăng nhập</label>
                        <div class="input-wrap"><i class="fa-solid fa-user"></i><input id="regUsername" name="username" type="text" placeholder="Tạo tên đăng nhập" minlength="3" maxlength="30" autocomplete="username" required></div>
                    </div>
                    <div class="role-note"><i class="fa-solid fa-circle-info"></i> Tài khoản đăng ký mới mặc định là <strong>Độc giả (khách hàng)</strong>.</div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrap"><i class="fa-solid fa-envelope"></i><input id="email" name="email" type="email" placeholder="example@email.com" autocomplete="email" required></div>
                    </div>
                    <div class="input-group">
                        <label for="regPassword">Mật khẩu</label>
                        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="regPassword" name="password" type="password" placeholder="Ít nhất 6 ký tự" minlength="6" autocomplete="new-password" required><button class="toggle-password" type="button" data-target="regPassword" aria-label="Hiện hoặc ẩn mật khẩu"><i class="fa-regular fa-eye"></i></button></div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Xác nhận mật khẩu</label>
                        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" minlength="6" autocomplete="new-password" required><button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Hiện hoặc ẩn mật khẩu"><i class="fa-regular fa-eye"></i></button></div>
                    </div>
                    <button class="primary-btn" type="submit"><i class="fa-solid fa-user-plus"></i> ĐĂNG KÝ TÀI KHOẢN</button>
                </form>
                <p class="switch-text">Đã có tài khoản? <button type="button" class="switch-btn" id="showLogin">Đăng nhập</button></p>
            </section>
            <div id="message" class="message" role="status" aria-live="polite"></div>
        </section>
    </main>
    <script src="demo_dndk.js"></script>
</body>
</html>
